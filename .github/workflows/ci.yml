# PR作成時と master への push 時に、ビルドとテストを自動実行する。
#
# 目的は「テストを実行したという事実を成果物に残すこと」。
# ローカルで実行した結果はPR本文の記述にしかならず、レビュー側に検証手段が無い。
name: CI

on:
  pull_request:
  push:
    branches: [master]

# 同じブランチへ連続でpushした場合、古い実行は打ち切る(待ち時間と実行時間の節約)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # ~/.m2 をキャッシュし、2回目以降の依存解決を短縮する。
          cache: maven

      # Testcontainers が PostgreSQL と LocalStack のコンテナを起動するため Docker が要る。
      # ubuntu-latest ランナーには Docker が同梱されているので追加のセットアップは不要。
      - name: Run tests
        run: mvn -B --no-transfer-progress test
        working-directory: backend

  terraform:
    name: terraform (infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.7"
          # ラッパーを無効にしないと、実行結果が標準出力に混ざって読みにくくなる。
          terraform_wrapper: false

      # 整形の揺れをレビューで指摘しなくて済むようにする。
      - name: Check formatting
        run: terraform fmt -check -recursive
        working-directory: infra

      # -backend=false はstateに触らないための指定。CIにはAWSの認証情報を置いておらず、
      # ローカルのstateも当然無い。ここで検証したいのは構文と参照の整合性だけである。
      - name: Initialize without backend
        run: terraform init -backend=false -input=false
        working-directory: infra

      - name: Validate
        run: terraform validate
        working-directory: infra

  frontend:
    name: frontend (Node 24)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # package-lock.json のとおりに入れる(install と違い lock を書き換えない)。
      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      # APIの型は docs/openapi.json から生成してコミットしている(#39)。
      # 生成し直さずにコミットすると、古い型のまま型検査が通ってしまい、
      # 「仕様と型が一致している」という前提が静かに崩れる。ここで再生成して差分が無いか検査する。
      # git diff では未追跡ファイルを検出できないため、status で見る。
      # 生成対象が増えて新しいファイルが出来た場合も捕まえる必要がある。
      - name: Check generated API types are up to date
        working-directory: frontend
        run: |
          npm run gen:api
          if [ -n "$(git status --porcelain src/api/generated)" ]; then
            echo "::error::生成されたAPI型が docs/openapi.json と一致していません。frontend で 'npm run gen:api' を実行してコミットしてください。"
            git status --porcelain src/api/generated
            git diff -- src/api/generated
            exit 1
          fi

      - name: Lint
        run: npm run lint
        working-directory: frontend

      # vitest は型検査をせずにトランスパイルするため、テストだけでは型エラーを検出できない。
      # 型検査(tsc -b)が走るのはこのビルドなので、テストとは別に実行する必要がある(#31)。
      - name: Build (type check)
        run: npm run build
        working-directory: frontend

      - name: Test
        run: npm test
        working-directory: frontend

      # パフォーマンステストのスクリプトは k6 と Node が .ts を直接実行するが、
      # どちらも型を「剥がす」だけで検査はしない。
      # (明らかな型エラーを含むスクリプトが警告も無く最後まで走ることを確認済み)
      # ここで tsc を回さないと、拡張子が .ts でも型の恩恵は一切得られない。
      - name: Type check performance test scripts
        run: npm run typecheck:perf
        working-directory: frontend

      # **本番に載る依存だけを門にする。**
      #
      # 入れていなかったため、high が8件放置されていた(2026-08-30)。
      # その中には React Router の CSRF 回避(RSCモード)が含まれていた。
      #
      # devDependency を門から外しているのは、**今の時点で直せない**ものが
      # あるためである。@hey-api/openapi-ts が同梱する js-yaml 4.x に
      # DoS の勧告が出ているが、上流の最新版(0.99.0)でもまだ 4.x のままで、
      # 上げる先が無い。ここで落とし続けると、いずれ誰かが無効化する。
      #
      # **見ないことにするのではなく、Dependabot に見張らせている**
      # (.github/dependabot.yml)。上流が直せば PR が来る。
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    # **19件のテストが手動実行のままだった。**
    #
    # 「テストがある」ことと「守られている」ことは別である。
    # PR のたびに回らないテストは、いずれ壊れたまま気づかれなくなる。
    #
    # 専用スタック(docker-compose.e2e.yml)は Playwright の globalSetup が
    # 起動し globalTeardown が破棄するため、ここで用意するのは Docker だけでよい。
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # axe-core によるアクセシビリティ検査を含む。
      #
      # **E2E_KEEP_STACK=1 でスタックを残す。** 既定では Playwright の
      # globalTeardown がコンテナごと破棄するため、**この後のログ収集が
      # 空になる**(実際に空だった)。ランナーは使い捨てなので残して構わない。
      - name: Run E2E
        run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_KEEP_STACK: "1"

      # **失敗したものは証跡ごと残す。** 落ちた理由は実行し直しても
      # 再現しないことがあり、その場の記録が無いと原因に辿り着けない。
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Show stack logs on failure
        if: failure()
        run: docker compose -p snsapp-e2e -f docker-compose.e2e.yml logs --no-color || true
