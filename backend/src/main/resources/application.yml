server:
  port: 8080
  # HTTPレスポンスの圧縮。Spring Bootの既定は無効で、有効化するまで全レスポンスが無圧縮で流れる。
  #
  # 実測(docs/perf-test-report.md 5-3):
  #   コメント502件の投稿で 163.2KB -> 8.1KB(95.1%削減)、
  #   フィード20件で 7.3KB -> 0.7KB(89.8%削減)。
  #   このAPIはJSONしか返さず、同じ語(フィールド名)が件数分繰り返されるため圧縮がよく効く。
  compression:
    enabled: true
    mime-types: application/json
    # 小さすぎるレスポンスは圧縮してもバイト数がほぼ減らず、CPUとヘッダーの分だけ損をする。
    # 1KBを下回るものは圧縮しない。
    min-response-size: 1KB

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sns_application}
    username: ${DB_USER:sns_user}
    password: ${DB_PASSWORD:local_dev_password}
    # コネクションプール(HikariCP)。これまで未指定で、Spring Bootの既定値に依存していた。
    #
    # 明示する理由は2つある。
    #
    # 1. デプロイ時の制約を計算できるようにするため。
    #    「タスク数 × maximum-pool-size ≦ RDSのmax_connections」が成り立たないと、
    #    タスクを増やした瞬間にDBの接続上限を超える。既定値依存のままではこの式を検証できない。
    #
    # 2. minimum-idle を明示するため。HikariCPの既定では minimum-idle は
    #    maximum-pool-size と同じになり、無負荷でも上限数の接続を保持し続ける。
    #    タスクを10個並べれば、誰も使っていなくても100接続をRDSに張ることになる。
    #
    # 値の根拠(docs/perf-test-report.md 6-3, 11-3):
    #   VU50の負荷テストで同時アクティブは最大6〜7、飽和時に10で頭打ちになった。
    #   ただし飽和の主因はプールではなくDBのCPUだったため、10のまま据え置く。
    #   増やしてもDBが処理し切れず、待ち行列の場所が移るだけである。
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      # 接続を取得できないまま待ち続ける時間の上限。
      # 既定の30秒は、上流(ALB等)のタイムアウトより長くなりやすい。
      # 上流が先に切ると、アプリ側にエラーが残らないまま利用者だけがエラーを見る状態になる。
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:10000}
      # プール内で使われないまま保持し続ける時間の上限(minimum-idle を超えた分が対象)。
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT_MS:600000}
      # 接続の最大寿命。DB側やネットワーク機器が切った接続を掴み続けないよう、
      # それらのタイムアウトより短くしておく。
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}
mybatis:
  mapper-locations: classpath:mapper/*.xml

# API仕様書(OpenAPI/Swagger UI)。
#
# /swagger-ui/** と /v3/api-docs は /api/ 配下ではないためJwtAuthFilterを素通りし、
# 認証なしで到達できる(JwtAuthFilter#doFilterInternal の早期returnを参照)。
# つまり配信する = 誰でも読める、を意味する。
#
# そのため既定を false(配信しない)にしている。仮に既定を true にすると、
# 環境変数を設定し忘れた瞬間に公開されてしまい、設定漏れが危険側に倒れる。
# 既定を false にしておけば、設定漏れの結果は「開発中に仕様書が見えない」だけで済む。
#
# ローカル開発では docker-compose.yml が SPRINGDOC_ENABLED=true を渡して有効化する。
springdoc:
  # コントローラにproducesを書いていないため、既定では成功レスポンスが */* になる。
  # 実際はJSONしか返さないので明示する。
  default-produces-media-type: application/json
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    # HTTPメソッド順に並べる(GET→POST→PATCH→DELETE)。既定は定義順で読み手が追いにくい。
    operations-sorter: method
    tags-sorter: alpha

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes+}
    access-token-expiration-seconds: ${ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  cookie:
    # 認証クッキーの Secure 属性。付けるとHTTPSでしか送信されなくなる。
    #
    # 環境によって必ず変える必要がある。ローカル開発とE2EはHTTPで、
    # デプロイ先(CloudFront配下)はHTTPSだからである。値を固定すると必ずどちらかが壊れる。
    #
    # 既定を false にしているのは、ローカル開発とE2Eを追加設定なしで動かせるようにするため。
    # デプロイ時は COOKIE_SECURE=true を必ず渡すこと(docs/aws-architecture.md 参照)。
    secure: ${COOKIE_SECURE:false}
  storage:
    s3:
      bucket: ${STORAGE_S3_BUCKET:sns-application-images-local}
      region: ${STORAGE_S3_REGION:ap-northeast-1}
      # LocalStack用のエンドポイント。実AWSへ向ける場合は空にする(SDK既定の接続先が使われる)。
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:4566}
      # 署名付きURLに埋め込むホスト。ブラウザから到達できる必要があるため、
      # コンテナ内部向けの endpoint とは別に指定できるようにしている。空なら endpoint と同じ。
      public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:}
      # 表示用URLの有効期限。フロントエンドがレスポンスをキャッシュするため、
      # 短すぎるとキャッシュ内のURLだけ先に失効して画像が壊れる。
      presign-expiry: ${STORAGE_S3_PRESIGN_EXPIRY:PT24H}
