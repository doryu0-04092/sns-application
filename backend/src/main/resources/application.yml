server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sns_application}
    username: ${DB_USER:sns_user}
    password: ${DB_PASSWORD:local_dev_password}
mybatis:
  mapper-locations: classpath:mapper/*.xml

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes+}
    access-token-expiration-seconds: ${ACCESS_TOKEN_EXPIRATION_SECONDS:900}
    refresh-token-expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:604800}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  storage:
    s3:
      bucket: ${STORAGE_S3_BUCKET:sns-application-images-local}
      region: ${STORAGE_S3_REGION:ap-northeast-1}
      # LocalStack用のエンドポイント。実AWSへ向ける場合は空にする(SDK既定の接続先が使われる)。
      endpoint: ${STORAGE_S3_ENDPOINT:http://localhost:4566}
      # 署名付きURLに埋め込むホスト。ブラウザから到達できる必要があるため、
      # コンテナ内部向けの endpoint とは別に指定できるようにしている。空なら endpoint と同じ。
      public-endpoint: ${STORAGE_S3_PUBLIC_ENDPOINT:}
      # 表示用URLの有効期限。フロントエンドがレスポンスをキャッシュするため、
      # 短すぎるとキャッシュ内のURLだけ先に失効して画像が壊れる。
      presign-expiry: ${STORAGE_S3_PRESIGN_EXPIRY:PT24H}
